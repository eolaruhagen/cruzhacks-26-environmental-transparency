name: Bill Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: bill-pipline
        run: bun install --frozen-lockfile

      - name: Drain queue batch
        working-directory: bill-pipline
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SECRET_API_KEY:      ${{ secrets.SECRET_API_KEY }}
          CONGRESS_API_KEY:    ${{ secrets.CONGRESS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_BILLS }}
          # 08:00-09:00 PT: hold off the hour before bill-sync so the
          # Congress.gov rate-limit window fully resets before sync fires.
          # 16:45-19:15 PT: 1h buffer ahead of the legacy ~18:00 PT pipeline
          # (occasionally drifts to 19:00) so an in-flight legacy run never
          # collides with us.
          BLACKOUT_WINDOWS:    '08:00-09:00;16:45-19:15'
          TIME_BUDGET_MS:      '540000'
        run: bun run pipeline
