name: Bill Sync

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'api | csv'
        required: false
        default: 'api'
      reason:
        description: 'manual run reason (for Discord embed)'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: bill-pipline
        run: bun install --frozen-lockfile

      - name: Run sync
        working-directory: bill-pipline
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SECRET_API_KEY:      ${{ secrets.SECRET_API_KEY }}
          CONGRESS_API_KEY:    ${{ secrets.CONGRESS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SYNC_SOURCE:         ${{ inputs.source || 'api' }}
          SYNC_REASON:         ${{ inputs.reason }}
        run: bun run sync
