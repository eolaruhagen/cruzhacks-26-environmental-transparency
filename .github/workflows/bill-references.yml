name: Bill References

on:
  # Cron disabled — re-enable when the frontend renders references (Stage 2).
  workflow_dispatch:

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install python deps
        working-directory: bill-pipline/python
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Install bun deps
        working-directory: bill-pipline
        run: bun install --frozen-lockfile

      - name: Run references worker
        working-directory: bill-pipline
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SECRET_API_KEY:      ${{ secrets.SECRET_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_BILLS }}
          TIME_BUDGET_MS:      '540000'
          EXTRACTOR_SCRIPT:    './python/extractor.py'
        run: bun run references
